<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <a href="listagem.html" class="link-voltar">Ver usuários cadastrados</a>

        <form id="formCadastro" novalidate>
            <!-- Linha 1: Nome, Data de Nascimento e Idade -->
            <div class="linha-formulario">
                <div class="campo campo-grande">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="dataNascimento">Data de Nascimento *</label>
                    <input type="text" id="dataNascimento" name="dataNascimento" placeholder="DD/MM/AAAA" maxlength="10"
                        required>
                </div>

                <div class="campo campo-pequeno">
                    <label for="idade">Idade *</label>
                    <input type="number" id="idade" name="idade" readonly placeholder="Auto" required>
                </div>
            </div>

            <!-- Linha 2: CPF, Sexo e Estado Civil -->
            <div class="linha-formulario">
                <div class="campo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>

                <div class="campo">
                    <label for="sexo">Sexo *</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Selecione...</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="estadoCivil">Estado Civil *</label>
                    <select id="estadoCivil" name="estadoCivil" required>
                        <option value="">Selecione...</option>
                        <option value="Solteiro">Solteiro(a)</option>
                        <option value="Casado">Casado(a)</option>
                        <option value="Divorciado">Divorciado(a)</option>
                        <option value="Viuvo">Viúvo(a)</option>
                    </select>
                </div>
            </div>

            <!-- Linha 3: Cônjuge (Obrigatório apenas se casado) -->
            <div class="linha-formulario" id="containerConjuge" style="display: none;">
                <div class="campo">
                    <label for="conjuge">Nome do Cônjuge *</label>
                    <input type="text" id="conjuge" name="conjuge" placeholder="Digite o nome do cônjuge">
                </div>
            </div>

            <!-- Linha 4: CEP, Cidade e Estado -->
            <div class="linha-formulario">
                <div class="campo">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                </div>

                <div class="campo campo-grande">
                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Ex: Goiânia" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado *</label>
                    <input type="text" id="estado" name="estado" placeholder="Ex: Goiás" required>
                </div>
            </div>

            <!-- Linha 5: Endereço e Complemento -->
            <div class="linha-formulario">
                <div class="campo campo-grande">
                    <label for="endereco">Endereço *</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro" required>
                </div>

                <div class="campo">
                    <label for="complemento">Complemento *</label>
                    <input type="text" id="complemento" name="complemento"
                        placeholder="Apto, bloco, casa... (ou 'Nenhum')" required>
                </div>
            </div>

            <!-- Linha 6: E-mail -->
            <div class="linha-formulario">
                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>
            </div>

            <!-- Botão de Ação -->
            <div class="acoes-formulario">
                <button type="submit" id="btnCadastrar" class="btn-primario">Cadastrar</button>
            </div>
        </form>
    </div>

    <script src="cadastro.js"></script>
</body>

</html>
